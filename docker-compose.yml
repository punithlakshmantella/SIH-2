version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cityvision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cityvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cityvision}
      POSTGRES_DB: ${POSTGRES_DB:-cityvision_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityvision} -d ${POSTGRES_DB:-cityvision_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cityvision_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityvision_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cityvision}:${POSTGRES_PASSWORD:-cityvision}@postgres:5432/${POSTGRES_DB:-cityvision_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey_sih2026_bel_cityvision_secret}
      - MAP_CONFIG=${MAP_CONFIG:-{"center": [17.6868, 83.2185], "zoom": 12, "city": "Visakhapatnam"}}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityvision_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cityvision}:${POSTGRES_PASSWORD:-cityvision}@postgres:5432/${POSTGRES_DB:-cityvision_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey_sih2026_bel_cityvision_secret}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cityvision_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
